<header class="sticky top-0 z-99999 w-full border-b border-gray-200 bg-white/95 backdrop-blur">
  <div class="px-3 py-3 sm:px-4 lg:px-6">
    <div class="flex flex-wrap items-center gap-3 lg:flex-nowrap">
      <button
        type="button"
        class="flex h-10 w-10 items-center justify-center rounded-lg border border-gray-200 text-gray-600 transition hover:bg-gray-50 lg:h-11 lg:w-11"
        [ngClass]="{
          'bg-gray-100': isMobileOpen$ | async
        }"
        (click)="handleToggle()"
        aria-label="Afficher ou masquer la barre laterale"
      >
        @if (isMobileOpen$ | async) {
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
          <path d="M6 6L18 18M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
        </svg>
        } @else {
        <svg width="18" height="14" viewBox="0 0 16 12" fill="none">
          <path d="M1 1H15M1 6H10M1 11H15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
        </svg>
        }
      </button>

      <div class="min-w-0 flex-1">
        <nav class="hidden items-center gap-2 text-sm text-gray-500 md:flex">
          @for (crumb of breadcrumbItems; track crumb.route; let isLast = $last) {
          @if (!isLast) {
          <a [routerLink]="crumb.route" class="transition hover:text-gray-700">{{ crumb.label }}</a>
          <span class="text-gray-300">/</span>
          } @else {
          <span class="font-semibold text-gray-800">{{ crumb.label }}</span>
          }
          }
        </nav>
      </div>

      <form (submit)="onSubmitGlobalSearch($event)" class="order-4 w-full lg:order-none lg:w-[440px] xl:w-[520px]">
        <div class="relative">
          <span class="pointer-events-none absolute left-3 top-1/2 -translate-y-1/2 text-gray-400">
            <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
              <path d="M14.5 14.5L18 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path>
              <circle cx="9" cy="9" r="6" stroke="currentColor" stroke-width="1.6"></circle>
            </svg>
          </span>

          <input
            #globalSearchInput
            type="search"
            [(ngModel)]="globalSearch"
            name="globalSearch"
            placeholder="Rechercher (documents, evenements, salles...)"
            class="h-11 w-full rounded-xl border border-gray-300 bg-white pl-10 pr-20 text-sm text-gray-800 placeholder:text-gray-400 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10"
          />

          <span class="absolute right-2 top-1/2 -translate-y-1/2 rounded-md border border-gray-200 bg-gray-50 px-2 py-1 text-xs font-semibold text-gray-500">
            Ctrl + K
          </span>
        </div>
      </form>

      <div
        [ngClass]="isApplicationMenuOpen ? 'flex' : 'hidden lg:flex'"
        class="w-full items-center justify-end gap-2 sm:gap-3 lg:w-auto"
      >
        <a
          routerLink="/notifications"
          class="relative inline-flex h-11 w-11 items-center justify-center rounded-full border border-gray-200 bg-white text-gray-500 transition hover:bg-gray-50 hover:text-gray-700"
          title="Messages et emails"
          aria-label="Messages et emails"
        >
          <span
            *ngIf="unreadNotificationsCount > 0"
            class="absolute -right-0.5 -top-0.5 inline-flex min-h-5 min-w-5 items-center justify-center rounded-full bg-brand-500 px-1.5 text-[11px] font-semibold text-white"
          >
            {{ unreadNotificationsCount > 99 ? '99+' : unreadNotificationsCount }}
          </span>
          <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
            <rect x="2" y="4.5" width="16" height="11" rx="2" stroke="currentColor" stroke-width="1.5"></rect>
            <path d="M2.5 6L10 11L17.5 6" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </a>

        <app-notification-dropdown />
        <app-user-dropdown />
      </div>

      <button
        type="button"
        (click)="toggleApplicationMenu()"
        class="ml-auto inline-flex h-10 w-10 items-center justify-center rounded-lg text-gray-600 transition hover:bg-gray-100 lg:hidden"
      >
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none">
          <path d="M12 5V5.01M12 12V12.01M12 19V19.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"></path>
        </svg>
      </button>
    </div>
  </div>
</header>
