<div class="relative w-full">
  <button
    type="button"
    (click)="toggleDropdown()"
    [disabled]="isComponentDisabled"
    class="dropdown-toggle flex h-11 w-full items-center justify-between rounded-lg border border-gray-300 bg-transparent px-4 py-2.5 text-left text-sm shadow-theme-xs transition focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 disabled:cursor-not-allowed disabled:opacity-60 dark:border-gray-700 dark:bg-gray-900 dark:focus:border-brand-800"
    [ngClass]="(hasSelection ? 'text-gray-800 dark:text-white/90' : 'text-gray-400 dark:text-gray-400') + ' ' + className"
  >
    <span class="truncate">{{ displayLabel }}</span>
    <svg class="ml-3 shrink-0 text-gray-500 dark:text-gray-400" width="18" height="18" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M5 7.5L10 12.5L15 7.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" />
    </svg>
  </button>

  <app-dropdown
    [isOpen]="isOpen"
    (close)="closeDropdown()"
    [className]="'left-0 w-full p-0 overflow-hidden ' + dropdownClassName"
  >
    <ng-container *ngIf="options.length > 0; else noOptionsTemplate">
      <ng-container *ngFor="let option of options; let isFirst = first; trackBy: trackByOption">
        <div *ngIf="!isFirst || option.dividerBefore" class="border-t border-gray-200 dark:border-gray-700"></div>
        <button
          type="button"
          (click)="selectOption(option)"
          [disabled]="option.disabled"
          class="flex w-full items-center justify-between px-4 py-2.5 text-left text-sm font-medium transition disabled:cursor-not-allowed disabled:opacity-50"
          [ngClass]="isSelected(option)
            ? 'bg-brand-600 text-white dark:bg-brand-500 dark:text-white'
            : 'text-gray-800 hover:bg-gray-100 dark:text-gray-200 dark:hover:bg-white/5'"
        >
          <span class="truncate">{{ option.label }}</span>
          <svg *ngIf="isSelected(option)" width="16" height="16" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" class="ml-2 shrink-0">
            <path d="M5.5 10.5L8.5 13.5L14.5 7.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
        </button>
      </ng-container>
    </ng-container>

    <ng-template #noOptionsTemplate>
      <div class="px-4 py-3 text-sm text-gray-500 dark:text-gray-400">No options available</div>
    </ng-template>
  </app-dropdown>
</div>
