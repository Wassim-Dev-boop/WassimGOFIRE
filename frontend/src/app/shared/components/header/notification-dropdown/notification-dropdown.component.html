<div class="relative">
  <button
    class="relative flex items-center justify-center text-gray-500 transition-colors bg-white border border-gray-200 rounded-full dropdown-toggle hover:text-gray-700 h-11 w-11 hover:bg-gray-100 dark:border-gray-800 dark:bg-gray-900 dark:text-gray-400 dark:hover:bg-gray-800 dark:hover:text-white"
    (click)="toggleDropdown()"
  >
    <span
      class="absolute right-0 top-0.5 z-10 h-2 w-2 rounded-full bg-orange-400"
      [ngClass]="{ 'hidden': !notifying, 'flex': notifying }"
    >
      <span class="absolute inline-flex w-full h-full bg-orange-400 rounded-full opacity-75 animate-ping"></span>
    </span>
    <svg
      class="fill-current"
      width="20"
      height="20"
      viewBox="0 0 20 20"
      xmlns="http://www.w3.org/2000/svg"
    >
      <path
        fill-rule="evenodd"
        clip-rule="evenodd"
        d="M10.75 2.29248C10.75 1.87827 10.4143 1.54248 10 1.54248C9.58583 1.54248 9.25004 1.87827 9.25004 2.29248V2.83613C6.08266 3.20733 3.62504 5.9004 3.62504 9.16748V14.4591H3.33337C2.91916 14.4591 2.58337 14.7949 2.58337 15.2091C2.58337 15.6234 2.91916 15.9591 3.33337 15.9591H4.37504H15.625H16.6667C17.0809 15.9591 17.4167 15.6234 17.4167 15.2091C17.4167 14.7949 17.0809 14.4591 16.6667 14.4591H16.375V9.16748C16.375 5.9004 13.9174 3.20733 10.75 2.83613V2.29248ZM14.875 14.4591V9.16748C14.875 6.47509 12.6924 4.29248 10 4.29248C7.30765 4.29248 5.12504 6.47509 5.12504 9.16748V14.4591H14.875ZM8.00004 17.7085C8.00004 18.1228 8.33583 18.4585 8.75004 18.4585H11.25C11.6643 18.4585 12 18.1228 12 17.7085C12 17.2943 11.6643 16.9585 11.25 16.9585H8.75004C8.33583 16.9585 8.00004 17.2943 8.00004 17.7085Z"
        fill="currentColor"
      />
    </svg>
  </button>
  <app-dropdown
    [isOpen]="isOpen"
    (close)="closeDropdown()"
    className="absolute -right-[240px] mt-[17px] flex h-[500px] w-[350px] flex-col rounded-2xl border border-gray-200 bg-white p-3 shadow-theme-lg dark:border-gray-800 dark:bg-gray-dark sm:w-[380px] lg:right-0"
  >
    <div class="mb-3 flex items-center justify-between border-b border-gray-100 pb-3 dark:border-gray-700">
      <h5 class="text-lg font-semibold text-gray-800 dark:text-gray-200">
        Notifications
      </h5>
      <div class="flex items-center gap-2">
        <span class="rounded-full bg-brand-500/10 px-2 py-1 text-xs font-semibold text-brand-700 dark:bg-brand-500/20 dark:text-brand-300">
          {{ unreadCount }} non lues
        </span>
        <button
          type="button"
          (click)="markAllAsRead($event)"
          [disabled]="unreadCount === 0"
          class="rounded-md border border-gray-200 px-2 py-1 text-xs font-medium text-gray-600 hover:bg-gray-100 disabled:cursor-not-allowed disabled:opacity-50 dark:border-gray-700 dark:text-gray-300 dark:hover:bg-white/5"
        >
          Tout lire
        </button>
      </div>
    </div>
    <ul class="flex h-auto flex-col overflow-y-auto custom-scrollbar">
      <li *ngFor="let notification of latestNotifications">
        <button
          type="button"
          (click)="openNotification(notification)"
          class="w-full rounded-lg border-b border-gray-100 px-3 py-3 text-left transition hover:bg-gray-100 dark:border-gray-800 dark:hover:bg-white/5"
          [ngClass]="!notification.isRead ? 'bg-brand-500/[0.06] dark:bg-brand-500/[0.08]' : ''"
        >
          <div class="flex items-start gap-2.5">
            <span class="mt-2 inline-block h-2.5 w-2.5 rounded-full" [ngClass]="getLeadingDotClass(notification)"></span>

            <div class="min-w-0 flex-1">
              <div class="mb-1 flex items-center gap-2">
                <p class="truncate text-sm font-medium text-gray-800 dark:text-white/90">
                  {{ notification.title }}
                </p>
                <span class="inline-flex rounded-full px-2 py-0.5 text-xs font-semibold" [ngClass]="getBadgeClass(notification)">
                  {{ getCategoryLabel(notification) }}
                </span>
              </div>

              <p *ngIf="notification.message" class="line-clamp-2 text-xs text-gray-500 dark:text-gray-400">
                {{ notification.message }}
              </p>

              <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">
                {{ getRelativeTime(notification.createdAt) }}
              </p>
            </div>

            <span
              *ngIf="!notification.isRead"
              class="mt-2 inline-block h-2.5 w-2.5 rounded-full bg-brand-500"
            ></span>
          </div>
        </button>
      </li>

      <li *ngIf="latestNotifications.length === 0" class="px-4 py-8 text-center text-sm text-gray-500 dark:text-gray-400">
        Aucune notification
      </li>
    </ul>

    <button
      type="button"
      (click)="goToAllNotifications()"
      class="mt-3 block rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 transition hover:bg-gray-100 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-gray-700"
    >
      Voir toutes les notifications
    </button>
  </app-dropdown>
</div>
