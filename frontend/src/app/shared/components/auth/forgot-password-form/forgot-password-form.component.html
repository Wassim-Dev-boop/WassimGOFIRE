<a
  routerLink="/signin"
  class="inline-flex items-center gap-2 text-sm text-gray-500 transition-colors hover:text-gray-700"
>
  <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
    <path d="M12.7083 5L7.5 10.2083L12.7083 15.4167" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
  </svg>
  Retour a la connexion
</a>

<div class="mt-8">
  <h1 class="text-3xl font-semibold text-gray-900">Mot de passe oublie</h1>
  <p class="mt-2 text-sm text-gray-500">
    Entrez votre email pour recevoir un lien de reinitialisation.
  </p>

  <form (ngSubmit)="onSubmit()" class="mt-7 space-y-5">
    <div>
      <app-label>Email <span class="text-error-500">*</span></app-label>
      <app-input-field
        type="email"
        placeholder="votre.email@cnstn.tn"
        [value]="email"
        (valueChange)="onEmailChange($event)"
        name="email"
        autocomplete="email"
        class="form-input"
        required
      />
    </div>

    <div *ngIf="errorMessage" class="rounded-lg border border-error-300 bg-error-50 px-3 py-2 text-sm text-error-700">
      {{ errorMessage }}
    </div>

    <div *ngIf="successMessage" class="rounded-lg border border-success-300 bg-success-50 px-3 py-2 text-sm text-success-700">
      {{ successMessage }}
    </div>

    <app-button className="w-full" size="sm" [disabled]="isSubmitting" (btnClick)="onSubmit()">
      {{ isSubmitting ? 'Envoi en cours...' : 'Envoyer le lien de reinitialisation' }}
    </app-button>
  </form>

  <p class="mt-6 text-sm text-gray-600">
    Vous vous souvenez de votre mot de passe ?
    <a routerLink="/signin" class="font-semibold text-brand-600 hover:text-brand-700">Se connecter</a>
  </p>
</div>
