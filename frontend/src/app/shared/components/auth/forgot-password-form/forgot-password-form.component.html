<div class="w-full max-w-md pt-10 mx-auto">
  <a
    routerLink="/signin"
    class="inline-flex items-center text-sm text-gray-500 transition-colors hover:text-gray-700 dark:text-gray-400 dark:hover:text-gray-300"
  >
    <svg xmlns="http://www.w3.org/2000/svg" width="1em" height="1em" viewBox="0 0 20 20" fill="none" class="size-5">
      <path d="M12.7083 5L7.5 10.2083L12.7083 15.4167" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path>
    </svg>
    Back to sign in
  </a>
</div>

<div class="flex flex-col justify-center flex-1 w-full max-w-md mx-auto">
  <div>
    <div class="mb-5 sm:mb-8">
      <h1 class="mb-2 font-semibold text-gray-800 text-title-sm dark:text-white/90 sm:text-title-md">
        Forgot Password
      </h1>
      <p class="text-sm text-gray-500 dark:text-gray-400">
        Entrez votre email pour recevoir un lien de reinitialisation.
      </p>
    </div>

    <form (ngSubmit)="onSubmit()" class="space-y-6">
      <div>
        <app-label>Email <span class="text-error-500">*</span></app-label>
        <app-input-field
          type="email"
          placeholder="ex: etudiant@cnstn.tn"
          [value]="email"
          (valueChange)="onEmailChange($event)"
          name="email"
          autocomplete="email"
          class="form-input"
          required
        />
      </div>

      <div *ngIf="errorMessage" class="rounded-lg border border-error-300 bg-error-50 px-3 py-2 text-sm text-error-600 dark:border-error-500/40 dark:bg-error-500/10 dark:text-error-300">
        {{ errorMessage }}
      </div>

      <div *ngIf="successMessage" class="rounded-lg border border-success-300 bg-success-50 px-3 py-2 text-sm text-success-600 dark:border-success-500/40 dark:bg-success-500/10 dark:text-success-300">
        {{ successMessage }}
      </div>

      <app-button
        className="w-full"
        size="sm"
        [disabled]="isSubmitting"
        (btnClick)="onSubmit()"
      >
        {{ isSubmitting ? 'Envoi en cours...' : 'Send Reset Link' }}
      </app-button>
    </form>

    <div class="mt-5">
      <p class="text-sm font-normal text-center text-gray-700 dark:text-gray-400 sm:text-start">
        Remember your password?
        <a
          routerLink="/signin"
          class="text-brand-500 hover:text-brand-600 dark:text-brand-400"
        >
          Sign In
        </a>
      </p>
    </div>
  </div>
</div>
