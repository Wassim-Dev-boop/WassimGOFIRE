<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2200" viewBox="0 0 1600 2200" role="img" aria-labelledby="title desc">
  <title id="title">Diagramme de cas d'utilisation global - CNSTN Intranet</title>
  <desc id="desc">Diagramme UML de cas d'utilisation presentant les acteurs, les fonctionnalites principales et les relations include, extend et heritage.</desc>
  <defs>
    <style>
      .bg { fill: #ffffff; }
      .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 16px Arial, Helvetica, sans-serif; fill: #475569; }
      .frame { fill: #ffffff; stroke: #64748b; stroke-width: 3; }
      .frame-title { font: 700 20px Arial, Helvetica, sans-serif; fill: #334155; }
      .actor-line { stroke: #1f2937; stroke-width: 3; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .actor-label { font: 600 15px Arial, Helvetica, sans-serif; fill: #111827; text-anchor: middle; }
      .use-main { fill: #dbeafe; stroke: #2563eb; stroke-width: 2.2; }
      .use-admin { fill: #dcfce7; stroke: #16a34a; stroke-width: 2.2; }
      .use-validation { fill: #ffedd5; stroke: #f97316; stroke-width: 2.2; }
      .use-it { fill: #ede9fe; stroke: #7c3aed; stroke-width: 2.2; }
      .use-sub { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; }
      .use-text { font: 600 16px Arial, Helvetica, sans-serif; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .use-text-small { font: 600 14px Arial, Helvetica, sans-serif; fill: #334155; text-anchor: middle; dominant-baseline: middle; }
      .assoc { stroke: #111827; stroke-width: 1.7; fill: none; }
      .include { stroke: #64748b; stroke-width: 1.8; stroke-dasharray: 8 6; fill: none; }
      .extend { stroke: #c2410c; stroke-width: 1.8; stroke-dasharray: 8 6; fill: none; }
      .inherit { stroke: #64748b; stroke-width: 2.1; fill: none; }
      .label-include { font: 600 13px Arial, Helvetica, sans-serif; fill: #475569; }
      .label-extend { font: 600 13px Arial, Helvetica, sans-serif; fill: #9a3412; }
      .legend-title { font: 700 15px Arial, Helvetica, sans-serif; fill: #334155; }
      .legend-text { font: 500 13px Arial, Helvetica, sans-serif; fill: #475569; }
    </style>
    <marker id="openArrowGray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#64748b" stroke-width="1.8"/>
    </marker>
    <marker id="openArrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 2 2 L 10 6 L 2 10" fill="none" stroke="#c2410c" stroke-width="1.8"/>
    </marker>
    <marker id="inheritArrow" markerWidth="16" markerHeight="14" refX="14" refY="7" orient="auto" markerUnits="strokeWidth">
      <path d="M 2 2 L 14 7 L 2 12 Z" fill="#ffffff" stroke="#64748b" stroke-width="1.8"/>
    </marker>
    <symbol id="actor" viewBox="0 0 90 90">
      <circle class="actor-line" cx="45" cy="16" r="10"/>
      <path class="actor-line" d="M45 26 V55"/>
      <path class="actor-line" d="M22 38 H68"/>
      <path class="actor-line" d="M45 55 L24 82"/>
      <path class="actor-line" d="M45 55 L66 82"/>
    </symbol>
  </defs>

  <rect class="bg" x="0" y="0" width="1600" height="2200"/>
  <text class="title" x="800" y="55" text-anchor="middle">Diagramme de cas d'utilisation global</text>
  <text class="subtitle" x="800" y="84" text-anchor="middle">Plateforme intranet CNSTN - vue globale des acteurs, cas metier et relations UML</text>

  <rect class="frame" x="360" y="115" width="850" height="1900"/>
  <text class="frame-title" x="385" y="150">Systeme CNSTN Intranet</text>

  <!-- Acteurs -->
  <use href="#actor" x="90" y="140" width="90" height="90"/>
  <text class="actor-label" x="135" y="248">Employe</text>

  <use href="#actor" x="90" y="420" width="90" height="90"/>
  <text class="actor-label" x="135" y="528">Administrateur</text>

  <use href="#actor" x="90" y="575" width="90" height="90"/>
  <text class="actor-label" x="135" y="683">Chef</text>
  <text class="actor-label" x="135" y="701">hierarchique</text>

  <use href="#actor" x="90" y="730" width="90" height="90"/>
  <text class="actor-label" x="135" y="838">Responsable salle</text>

  <use href="#actor" x="90" y="885" width="90" height="90"/>
  <text class="actor-label" x="135" y="993">Responsable</text>
  <text class="actor-label" x="135" y="1011">securite</text>

  <use href="#actor" x="90" y="1040" width="90" height="90"/>
  <text class="actor-label" x="135" y="1148">Directeur DSN</text>

  <use href="#actor" x="90" y="1195" width="90" height="90"/>
  <text class="actor-label" x="135" y="1303">Responsable IT</text>

  <use href="#actor" x="90" y="1350" width="90" height="90"/>
  <text class="actor-label" x="135" y="1458">Responsable</text>
  <text class="actor-label" x="135" y="1476">qualite</text>

  <use href="#actor" x="1335" y="1830" width="90" height="90"/>
  <text class="actor-label" x="1380" y="1938">Visiteur</text>

  <!-- Heritage acteurs -->
  <path class="inherit" d="M235 1395 V185 H180" marker-end="url(#inheritArrow)"/>
  <path class="inherit" d="M180 465 H235"/>
  <path class="inherit" d="M180 620 H235"/>
  <path class="inherit" d="M180 775 H235"/>
  <path class="inherit" d="M180 930 H235"/>
  <path class="inherit" d="M180 1085 H235"/>
  <path class="inherit" d="M180 1240 H235"/>
  <path class="inherit" d="M180 1395 H235"/>

  <!-- Cas d'utilisation principaux -->
  <ellipse class="use-main" cx="600" cy="210" rx="130" ry="32"/>
  <text class="use-text" x="600" y="210">S'authentifier</text>

  <ellipse class="use-main" cx="600" cy="310" rx="130" ry="32"/>
  <text class="use-text" x="600" y="310">Gerer son compte</text>

  <ellipse class="use-main" cx="600" cy="410" rx="130" ry="32"/>
  <text class="use-text" x="600" y="410">Consulter notifications</text>

  <ellipse class="use-main" cx="600" cy="510" rx="130" ry="32"/>
  <text class="use-text" x="600" y="510">Faire demandes metier</text>

  <ellipse class="use-main" cx="600" cy="610" rx="130" ry="32"/>
  <text class="use-text" x="600" y="610">Gerer reservations</text>

  <ellipse class="use-admin" cx="600" cy="720" rx="130" ry="32"/>
  <text class="use-text" x="600" y="720">Administrer utilisateurs</text>
  <text class="use-text-small" x="600" y="739">et droits</text>

  <ellipse class="use-admin" cx="600" cy="820" rx="130" ry="32"/>
  <text class="use-text" x="600" y="820">Configurer procedures</text>

  <ellipse class="use-main" cx="600" cy="920" rx="130" ry="32"/>
  <text class="use-text" x="600" y="920">Gerer evenements</text>

  <ellipse class="use-admin" cx="600" cy="1020" rx="130" ry="32"/>
  <text class="use-text" x="600" y="1020">Gerer salles</text>
  <text class="use-text-small" x="600" y="1039">et equipements</text>

  <ellipse class="use-validation" cx="600" cy="1120" rx="130" ry="32"/>
  <text class="use-text" x="600" y="1120">Valider demandes</text>

  <ellipse class="use-validation" cx="600" cy="1220" rx="130" ry="32"/>
  <text class="use-text" x="600" y="1220">Valider reservations</text>

  <ellipse class="use-validation" cx="600" cy="1320" rx="130" ry="32"/>
  <text class="use-text" x="600" y="1320">Controler securite</text>

  <ellipse class="use-validation" cx="600" cy="1420" rx="130" ry="32"/>
  <text class="use-text" x="600" y="1420">Superviser evenements</text>
  <text class="use-text-small" x="600" y="1439">et IT</text>

  <ellipse class="use-it" cx="600" cy="1540" rx="130" ry="32"/>
  <text class="use-text" x="600" y="1540">Gerer parc et</text>
  <text class="use-text-small" x="600" y="1559">interventions IT</text>

  <ellipse class="use-main" cx="600" cy="1660" rx="130" ry="32"/>
  <text class="use-text" x="600" y="1660">Gerer documents GED</text>

  <ellipse class="use-main" cx="600" cy="1855" rx="130" ry="32"/>
  <text class="use-text" x="600" y="1855">Rejoindre reunion</text>

  <!-- Sous-cas metier -->
  <ellipse class="use-sub" cx="1000" cy="430" rx="125" ry="30"/>
  <text class="use-text-small" x="1000" y="430">Creer evenement</text>

  <ellipse class="use-sub" cx="1000" cy="510" rx="125" ry="30"/>
  <text class="use-text-small" x="1000" y="510">Demander reservation</text>

  <ellipse class="use-sub" cx="1000" cy="590" rx="125" ry="30"/>
  <text class="use-text-small" x="1000" y="590">Declarer intervention</text>

  <ellipse class="use-sub" cx="1000" cy="670" rx="125" ry="30"/>
  <text class="use-text-small" x="1000" y="670">Deposer document GED</text>

  <!-- Associations acteurs / cas -->
  <path class="assoc" d="M180 185 L470 310"/>
  <path class="assoc" d="M180 185 L470 410"/>
  <path class="assoc" d="M180 185 L470 510"/>
  <path class="assoc" d="M180 185 L470 610"/>

  <path class="assoc" d="M180 465 L470 720"/>
  <path class="assoc" d="M180 465 L470 820"/>
  <path class="assoc" d="M180 465 L470 1120"/>

  <path class="assoc" d="M180 620 L470 510"/>
  <path class="assoc" d="M180 620 L470 1120"/>
  <path class="assoc" d="M180 620 L470 920"/>

  <path class="assoc" d="M180 775 L470 1020"/>
  <path class="assoc" d="M180 775 L470 1220"/>

  <path class="assoc" d="M180 930 L470 1320"/>
  <path class="assoc" d="M180 930 L470 1220"/>

  <path class="assoc" d="M180 1085 L470 1420"/>
  <path class="assoc" d="M180 1085 L470 1120"/>

  <path class="assoc" d="M180 1240 L470 1540"/>
  <path class="assoc" d="M180 1395 L470 1660"/>

  <path class="assoc" d="M1335 1875 L730 1855"/>

  <!-- Include vers authentification -->
  <path class="include" d="M710 310 L760 260 L720 220" marker-end="url(#openArrowGray)"/>
  <path class="include" d="M710 510 L805 390 L710 220" marker-end="url(#openArrowGray)"/>
  <path class="include" d="M710 610 L840 430 L715 220" marker-end="url(#openArrowGray)"/>
  <path class="include" d="M710 720 L870 460 L718 220" marker-end="url(#openArrowGray)"/>
  <path class="include" d="M710 920 L910 500 L720 220" marker-end="url(#openArrowGray)"/>
  <path class="include" d="M710 1120 L940 560 L722 220" marker-end="url(#openArrowGray)"/>
  <path class="include" d="M710 1540 L960 620 L724 220" marker-end="url(#openArrowGray)"/>
  <path class="include" d="M710 1660 L980 690 L726 220" marker-end="url(#openArrowGray)"/>
  <text class="label-include" x="870" y="360">&lt;&lt;include&gt;&gt;</text>

  <!-- Extend globaux -->
  <path class="extend" d="M1000 430 L725 510" marker-end="url(#openArrowOrange)"/>
  <path class="extend" d="M875 510 L730 510" marker-end="url(#openArrowOrange)"/>
  <path class="extend" d="M1000 590 L725 510" marker-end="url(#openArrowOrange)"/>
  <path class="extend" d="M1000 670 L725 510" marker-end="url(#openArrowOrange)"/>
  <text class="label-extend" x="820" y="485">&lt;&lt;extend&gt;&gt;</text>

  <path class="extend" d="M600 820 L600 752" marker-end="url(#openArrowOrange)"/>
  <text class="label-extend" x="620" y="786">&lt;&lt;extend&gt;&gt;</text>

  <path class="extend" d="M600 1320 L600 1252" marker-end="url(#openArrowOrange)"/>
  <path class="extend" d="M600 1220 L600 1152" marker-end="url(#openArrowOrange)"/>
  <text class="label-extend" x="620" y="1270">&lt;&lt;extend&gt;&gt;</text>

  <!-- Legende -->
  <rect x="360" y="2040" width="850" height="105" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="legend-title" x="390" y="2070">Legende</text>
  <ellipse class="use-main" cx="405" cy="2100" rx="16" ry="9"/>
  <text class="legend-text" x="430" y="2105">usage metier</text>
  <ellipse class="use-admin" cx="555" cy="2100" rx="16" ry="9"/>
  <text class="legend-text" x="580" y="2105">administration / gestion</text>
  <ellipse class="use-validation" cx="785" cy="2100" rx="16" ry="9"/>
  <text class="legend-text" x="810" y="2105">validation / controle</text>
  <ellipse class="use-it" cx="1000" cy="2100" rx="16" ry="9"/>
  <text class="legend-text" x="1025" y="2105">operations IT</text>
  <path class="include" d="M390 2128 H455" marker-end="url(#openArrowGray)"/>
  <text class="legend-text" x="470" y="2133">include obligatoire</text>
  <path class="extend" d="M645 2128 H710" marker-end="url(#openArrowOrange)"/>
  <text class="legend-text" x="725" y="2133">extend conditionnel / specialise</text>
</svg>
