server:
  port: 8087

spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/reporting_db
    username: postgres
    password: postgres
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://host.docker.internal:8090/realms/cnstn-intranet}
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

resilience4j:
  circuitbreaker:
    instances:
      kpiAggregator:
        slidingWindowSize: 20
        failureRateThreshold: 50
        waitDurationInOpenState: 10s

app:
  auth-user:
    base-url: ${AUTH_USER_SERVICE_URL:http://auth-user-service:8081}
    internal-api-key: ${AUTH_USER_INTERNAL_API_KEY:${NOTIFICATION_INTERNAL_API_KEY:change-me}}
